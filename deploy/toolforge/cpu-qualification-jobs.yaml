# Publication-invisible, on-demand CPU qualification cells. Load exactly one
# definition at a time and wait for it to finish before loading the next one;
# overlapping cells would invalidate CPU and NFS throughput measurements.
# These jobs reuse active immutable generations and delete isolated output and
# scratch on exit. Only their compact capacity receipts are retained.
# The 4-CPU cells require a per-job CPU limit of at least 4. Toolforge reported
# a 3-CPU per-job limit for this tool on 2026-08-26; request the increase before
# attempting to load those definitions.

- name: wiki-econ-cpu-nl-c1-t1-w1
  image: tool-wiki-economics/tool-wiki-economics:latest
  command: deploy/toolforge/run-cpu-qualification-cell.sh nlwiki 1 1 1
  filelog: true
  mount: all
  mem: 6Gi
  cpu: "1"

- name: wiki-econ-cpu-nl-c2-t2-w1
