# Toolforge Jobs definitions for wiki-economics.
#
# Load the production schedules with:
#   deploy/toolforge/load-scheduled-jobs.sh deploy/toolforge/jobs.yaml
# Never bulk-load this file directly: Toolforge treats definitions without a
# schedule as one-offs and starts them immediately. To deliberately launch one
# legacy job, use `toolforge jobs load --job <name> deploy/toolforge/jobs.yaml`.
#
# Replace <TOOL_IMAGE> with a short image name from `toolforge jobs images`
# after `toolforge build start <repo-url>` finishes (Toolforge's Build
# Service — Cloud Native Buildpacks, detected from root Cargo.toml +
# package.json + Procfile; no Dockerfile involved — see README.md).
# Runtime configuration must already exist via `toolforge envvars create` before
# loading this file; Toolforge injects tool-wide variables into every job.
#
# WIKI_ECON_BIN must also be set tool-wide (`toolforge envvars create
# WIKI_ECON_BIN /data/project/wiki-economics/app/current/wiki-econ`) before
# the job below runs. Operators install immutable binaries on shared NFS
# over SSH; the buildpack image intentionally does not compile or contain one.
# See README.md's binary release runbook.
#
# Top-level must be a bare list, not a `jobs:`-keyed mapping: the installed
# `toolforge jobs load` (jobs_cli/cli.py's op_load) does `for job in
# jobslist` over the raw parsed YAML with no unwrapping, so a `jobs:` wrapper
# key iterates as the single string "jobs" and crashes with
# `AttributeError: 'str' object has no attribute 'get'`.
#
# wiki-econ-admin is a buildservice webservice, not a Toolforge Job. Manage it
# with `toolforge webservice buildservice ...`; its environment is documented
# in README.md and deploy/toolforge/rebuild-image.sh restarts it after builds.

- name: wiki-econ-refresh
  image: tool-wiki-economics/tool-wiki-economics:latest
  command: deploy/toolforge/run-refresh.sh
  filelog: true
  mount: all
  # Use Toolforge's per-container ceiling. The Rust process logs cgroup
  # current, peak, and limit values throughout page_weekly_edits.
  mem: 6Gi
  cpu: "1"

# Fleet discovery represents every scheduled lifecycle entry in one atomic NFS
# queue. Fixed workers claim independent wikis with leases and heartbeats; the
# existing per-wiki preparation lock remains the final concurrency boundary.
- name: wiki-econ-fleet-controller
  image: tool-wiki-economics/tool-wiki-economics:latest
  command: deploy/toolforge/run-fleet-controller.sh
  schedule: "0 1 * * 0"
  filelog: true
  mount: all
  mem: 1Gi
  cpu: "1"

- name: wiki-econ-fleet-small-a
  image: tool-wiki-economics/tool-wiki-economics:latest
  command: deploy/toolforge/run-fleet-worker.sh small small-a --once
  schedule: "5,35 * * * *"
  filelog: true
  mount: all
  mem: 2Gi
  cpu: "1"

- name: wiki-econ-fleet-small-b
  image: tool-wiki-economics/tool-wiki-economics:latest
  command: deploy/toolforge/run-fleet-worker.sh small small-b --once
  schedule: "15,45 * * * *"
  filelog: true
  mount: all
  mem: 2Gi
  cpu: "1"

- name: wiki-econ-fleet-medium
  image: tool-wiki-economics/tool-wiki-economics:latest
  command: deploy/toolforge/run-fleet-worker.sh medium_large medium-1 --once
  schedule: "25,55 * * * *"
  filelog: true
  mount: all
  mem: 6Gi
  cpu: "1"

# Publication is intentionally short and independent. It selects only fully
# validated ready candidates, merges, builds, validates, and switches the
# release while holding the sole global publication lock.
- name: wiki-econ-publish-ready
  image: tool-wiki-economics/tool-wiki-economics:latest
  command: deploy/toolforge/run-publish-ready.sh
  schedule: "30 */2 * * *"
  filelog: true
  mount: all
  mem: 6Gi
  cpu: "1"

# Independent full-byte verification is intentionally infrequent. It detects
# corruption even when file size and mtime are unchanged, while normal
# publications consume the receipt fast path.
- name: wiki-econ-artifact-scrub
  image: tool-wiki-economics/tool-wiki-economics:latest
  command: deploy/toolforge/run-artifact-scrub.sh
  schedule: "0 5 15 * *"
  filelog: true
  mount: all
  mem: 2Gi
  cpu: "1"

# Legacy on-demand-only jobs (no `schedule:`): trigger with
# `toolforge jobs restart <name>`, e.g. after a site/docs-only change that
# doesn't need a fresh fetch or compute. See README.md's "On-demand stage jobs"
# section. Each still goes through run-refresh.sh's compatibility lock, so two
# legacy stage/monolithic jobs cannot race one another. Normal per-wiki
# preparation and publication use their narrower dedicated locks.
#
# Toolforge Jobs Framework CLI 0.3.9 has no per-job envvar support (`jobs run`
# takes no --envvar/--envvars flag; `toolforge envvars create` is tool-wide
# only), so each job's `command:` points at a small wrapper script that
# exports WIKI_ECON_REFRESH_STAGE and execs run-refresh.sh unmodified, rather
# than setting the stage via an `envvars:` field here.

- name: wiki-econ-ingest
  image: tool-wiki-economics/tool-wiki-economics:latest
  command: deploy/toolforge/run-refresh-ingest.sh
  filelog: true
  mount: all
  mem: 6Gi
  cpu: "1"

- name: wiki-econ-compute
  image: tool-wiki-economics/tool-wiki-economics:latest
  command: deploy/toolforge/run-refresh-compute.sh
  filelog: true
  mount: all
  mem: 6Gi
  cpu: "1"

- name: wiki-econ-site
  image: tool-wiki-economics/tool-wiki-economics:latest
  command: deploy/toolforge/run-refresh-site.sh
  filelog: true
  mount: all
  # Just the Observable build against already-published compute output.
  # Conservative initial estimate, not yet measured on Toolforge — tighten
  # after checking real cgroup peak usage (see the cgroup logging README.md
  # references for wiki-econ-refresh).
  mem: 2Gi
  cpu: "1"
