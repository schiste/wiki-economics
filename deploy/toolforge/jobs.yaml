# Toolforge Jobs definitions for wiki-economics.
#
# Load with:
#   toolforge jobs load deploy/toolforge/jobs.yaml
#
# Replace <TOOL_IMAGE> with a short image name from `toolforge jobs images`
# after `toolforge build start <repo-url>` finishes (Toolforge's Build
# Service — Cloud Native Buildpacks, detected from root Cargo.toml +
# package.json + Procfile; no Dockerfile involved — see README.md).
# Runtime configuration must already exist via `toolforge envvars create` before
# loading this file; Toolforge injects tool-wide variables into every job.
#
# WIKI_ECON_BIN must also be set tool-wide (`toolforge envvars create
# WIKI_ECON_BIN /data/project/wiki-economics/app/current/wiki-econ`) before
# the job below runs. Operators install immutable binaries on shared NFS
# over SSH; the buildpack image intentionally does not compile or contain one.
# See README.md's binary release runbook.
#
# Top-level must be a bare list, not a `jobs:`-keyed mapping: the installed
# `toolforge jobs load` (jobs_cli/cli.py's op_load) does `for job in
# jobslist` over the raw parsed YAML with no unwrapping, so a `jobs:` wrapper
# key iterates as the single string "jobs" and crashes with
# `AttributeError: 'str' object has no attribute 'get'`.
#
# wiki-econ-admin is a buildservice webservice, not a Toolforge Job. Manage it
# with `toolforge webservice buildservice ...`; its environment is documented
# in README.md and deploy/toolforge/rebuild-image.sh restarts it after builds.

- name: wiki-econ-refresh
  image: tool-wiki-economics/tool-wiki-economics:latest
  command: deploy/toolforge/run-refresh.sh
  schedule: "0 3 * * 0" # weekly; tighten only after measuring real run time
  filelog: "yes"
  mount: all
  # Use Toolforge's per-container ceiling. The Rust process logs cgroup
  # current, peak, and limit values throughout page_weekly_edits.
  mem: 6Gi
  cpu: "1"
