[package]
name = "wiki-econ"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
clap = { version = "4", features = ["derive"] }
polars = { version = "0.55.2", default-features = false, features = [
    "lazy",
    "csv",
    "parquet",
    "strings",
    "temporal",
    "dtype-date",
] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls", "json"] }
bzip2 = "0.5"
indicatif = "0.18"
rayon = "1.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
quick-xml = "0.41"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
regex = "1"
fs4 = "1.1.0"
sha2 = "0.11"
hex = "0.4"

[patch.crates-io]
# Keep these security patches narrow and auditable. See each vendor directory's
# PATCHES.md for the upstream version, rationale, and exact local changes.
object_store = { path = "vendor/object-store" }
polars-utils = { path = "vendor/polars-utils" }

[profile.release]
opt-level = 3
# Fat LTO made the final wiki-econ link dominate release builds. Thin LTO
# retains cross-crate optimization while keeping routine deploys practical.
lto = "thin"
